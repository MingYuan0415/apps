<?xml version="1.0" encoding="UTF-8"?>
<!-- MicroTech app icon: dark-theme geometric glyph, transparent base. -->
<!-- Shared icon rule: the 64-unit design box is exported at 72 px and drawn
     1:1 in the launcher well (72) and task switcher (56); every art element
     stays inside the centred x,y = 13..50 design box
     (one pixel of clearance on all sides). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <path d="M15 21h34" stroke="#93A0A6" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M15 21h10.5" stroke="#F5C451" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="25.5" cy="21" r="5" fill="#F5C451"/>
  <path d="M15 43h34" stroke="#93A0A6" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M15 43h23.5" stroke="#4FC4D8" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="38.5" cy="43" r="5" fill="#4FC4D8"/>
</svg>

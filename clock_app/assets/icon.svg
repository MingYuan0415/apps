<?xml version="1.0" encoding="UTF-8"?>
<!-- MicroTech app icon: dark-theme geometric glyph, transparent base. -->
<!-- Shared icon rule: the launcher draws this 64 px source 1:1 inside a 40 px
     window, so every art element stays inside the centred x,y = 12..52 box;
     the task switcher's larger window then shows the whole glyph plus margin. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <circle cx="32" cy="32" r="16.5" stroke="#F2F5F6" stroke-width="4"/>
  <path d="M32 17.5v2.6M46.5 32h-2.6M32 46.5v-2.6M17.5 32h2.6" stroke="#93A0A6" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M32 32 25.8 28.4" stroke="#F2F5F6" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M32 32 40.8 27" stroke="#F2F5F6" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="2.4" fill="#4FC4D8"/>
</svg>
